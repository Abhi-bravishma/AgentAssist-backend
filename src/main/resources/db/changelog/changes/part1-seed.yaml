      author: restructure-part1
      comment: >
        Chinese display names are the EXACT strings describeLanguage() produces
        today. Nothing reads this table until phase 1c switches the translation
        prompt to it — seeding is inert for byte-identity.
      changes:
        - insert:
            tableName: aa_language
            columns:
              - column: { name: code, value: "en" }
              - column: { name: display_name, value: "English" }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: aa_language
            columns:
              - column: { name: code, value: "zh" }
              - column: { name: display_name, value: "Chinese" }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: aa_language
            columns:
