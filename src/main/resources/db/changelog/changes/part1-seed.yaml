            tableName: aa_intent
            columns:
              - column: { name: code, value: "FEE_WAIVER" }
              - column: { name: display_name, value: "Fee Waiver" }
              - column: { name: active, valueBoolean: true }
              - column: { name: filtered_message_template, valueClobFile: "prompts/filtered.FEE_WAIVER.txt" }
        - insert:
            tableName: aa_intent
            columns:
              - column: { name: code, value: "HOME_LOAN_CLOSURE" }
              - column: { name: display_name, value: "Home Loan Closure" }
              - column: { name: active, valueBoolean: true }
              - column: { name: filtered_message_template, valueClobFile: "prompts/filtered.HOME_LOAN_CLOSURE.txt" }
        - insert:
            tableName: aa_intent
            columns:
              - column: { name: code, value: "POLICY" }
              - column: { name: display_name, value: "Policy" }
              - column: { name: active, valueBoolean: true }
              - column: { name: filtered_message_template, valueClobFile: "prompts/filtered.POLICY.txt" }
        - insert:
            tableName: aa_intent
            columns:
              - column: { name: code, value: "CLAIMS" }
              - column: { name: display_name, value: "Claims" }
              - column: { name: active, valueBoolean: true }
              - column: { name: filtered_message_template, valueClobFile: "prompts/filtered.CLAIMS.txt" }
        - insert:
            tableName: aa_intent
            columns:
              - column: { name: code, value: "TELCO" }
              - column: { name: display_name, value: "Telco" }
              - column: { name: active, valueBoolean: true }
              - column: { name: filtered_message_template, valueClobFile: "prompts/filtered.TELCO.txt" }
        - insert:
            tableName: aa_intent
            columns:
              - column: { name: code, value: "BILLING" }
              - column: { name: display_name, value: "Billing" }
              - column: { name: active, valueBoolean: true }
              - column: { name: filtered_message_template, valueClobFile: "prompts/filtered.BILLING.txt" }
      rollback:
        - sql:
            sql: DELETE FROM aa_intent WHERE code IN ('FEE_WAIVER','HOME_LOAN_CLOSURE','POLICY','CLAIMS','TELCO','BILLING')

