# Part 1 restructure — seed data (docs/RESTRUCTURE_PART1_PLAN.md §6).
#
# Every prompt/checklist/message is loaded from a file under prompts/ via
# valueClobFile (UTF-8). Those files were derived MECHANICALLY from the golden
# fixtures captured off the pre-restructure code (see
# src/test/java/com/agentassist/golden), with %s slots converted to named
# {placeholders} and %% already collapsed to % — i.e. they hold the RENDERED
# escape form the model actually receives. Do not hand-edit them without
# re-running the golden prompt tests.
#
# FK values use scalar subselects on the natural keys so the seed is
# independent of generated ids.
databaseChangeLog:

  - changeSet:
      id: part1-10-seed-projects
      author: restructure-part1
      changes:
        - insert:
            tableName: aa_project
            columns:
              - column: { name: code, value: "METRO" }
              - column: { name: display_name, value: "Metrobank" }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: aa_project
            columns:
              - column: { name: code, value: "SCB" }
              - column: { name: display_name, value: "Standard Chartered" }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: aa_project
            columns:
              - column: { name: code, value: "ALLIANZ" }
              - column: { name: display_name, value: "Allianz" }
              - column: { name: active, valueBoolean: true }
        - insert:
            tableName: aa_project
            columns:
              - column: { name: code, value: "TELCO" }
              - column: { name: display_name, value: "Telco (XL/AXIS)" }
              - column: { name: active, valueBoolean: true }
      rollback:
        - sql:
            sql: DELETE FROM aa_project WHERE code IN ('METRO','SCB','ALLIANZ','TELCO')

  - changeSet:
      id: part1-11-seed-brand-attributes
      author: restructure-part1
      comment: >
        Exact strings from resolveBankName/resolveHotline/resolveLoanEmail.
        NULL-project rows are the neutral global defaults. Note the documented
        asymmetry (plan §4.6): for an UNKNOWN project, bank_name falls back to
        the project code itself — that rule lives in BrandService, not here.
      changes:
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: attr_key, value: "bank_name" }
              - column: { name: attr_value, value: "your bank" }
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: attr_key, value: "hotline" }
              - column: { name: attr_value, value: "the customer service number printed on the back of the card" }
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: attr_key, value: "loan_email" }
              - column: { name: attr_value, value: "the loan servicing email address on the customer's statement" }
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: project_id, valueComputed: "(SELECT id FROM aa_project WHERE code = 'METRO')" }
              - column: { name: attr_key, value: "bank_name" }
              - column: { name: attr_value, value: "Metrobank" }
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: project_id, valueComputed: "(SELECT id FROM aa_project WHERE code = 'METRO')" }
              - column: { name: attr_key, value: "hotline" }
              - column: { name: attr_value, value: "(02) 88-700-700" }
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: project_id, valueComputed: "(SELECT id FROM aa_project WHERE code = 'METRO')" }
              - column: { name: attr_key, value: "loan_email" }
              - column: { name: attr_value, value: "CLOD-ASFD@metrobank.com.ph" }
        - insert:
            tableName: aa_brand_attribute
            columns:
              - column: { name: project_id, valueComputed: "(SELECT id FROM aa_project WHERE code = 'SCB')" }
              - column: { name: attr_key, value: "bank_name" }
              - column: { name: attr_value, value: "Standard Chartered" }
      rollback:
        - sql:
            sql: DELETE FROM aa_brand_attribute WHERE attr_key IN ('bank_name','hotline','loan_email')

