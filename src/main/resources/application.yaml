server:
  port: ${SERVER_PORT:8080}

# Force servlet mode (not reactive) when webflux is present
spring.main:
  web-application-type: servlet

# File upload configuration
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 50MB

spring:
  # Liquibase owns the config-registry (aa_*) tables. NOTE: this key was
  # previously at the ROOT level (liquibase.change-log), where Spring never
  # read it — it only worked because Liquibase's default location happens to
  # be this same file. Now bound properly under spring.*.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
      # Local MySQL (default)
      url: jdbc:mysql://localhost:3306/avaya_infinity?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8
      # Remote MySQL (uncomment below and comment above to use remote)
      # url: ${SPRING_DATASOURCE_URL:jdbc:mysql://135.222.41.146:3306/avaya_infinity?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8}
      username: root
      password: root
      driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    properties:
      hibernate:
        hbm2ddl:
          # Liquibase owns the aa_* config-registry tables. Without this filter,
          # ddl-auto:update tries to MODIFY their clob columns to varchar(255)
          # (shrinking any whose data happens to fit). See AaSchemaFilterProvider.
          schema_filter_provider: com.agentassist.configregistry.AaSchemaFilterProvider
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.3
      embedding:
        options:
          # Used by the internal RAG lane while no Ollama server exists.
          # 1536-dim — pairs with the agent_assist_docs_openai collection.
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://135.222.41.146:11434}
      init:
        timeout: 120s
        pull-model-strategy: never
      chat:
        options:
          # model: ${OLLAMA_MODEL:mistral:7b}  # Commented - less accurate sentiment
          model: ${OLLAMA_MODEL:llama3:8b}
          temperature: 0.2
          num-predict: 2048
      embedding:
        options:
          # For when rag.internal.embedding.provider=ollama (server not
          # available yet). The legacy mxbai collection requires exactly this
          # model — vectors from another embedder cannot be searched.
          model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}

# AI provider selection
ai:
  provider: ${AI_PROVIDER:openai}
  openai:
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.2
  ollama:
    # model: ${OLLAMA_MODEL:mistral:7b}  # Commented - less accurate sentiment
    model: ${OLLAMA_MODEL:llama3:8b}
    temperature: 0.2

# JWT configuration (IMPORTANT: Set JWT_SECRET env variable in production!)
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_64_CHAR_MIN_SECRET_KEY_HERE_12345}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# RAG Integration.
# mode=internal (default): the agent-assist lane copied IN-APP from
# bravishma-rag — Qdrant directly, suggestions via this app's own AI provider.
# mode=remote: the legacy HTTP client below, kept only as a rollback path.
rag:
  mode: ${RAG_MODE:internal}
  # --- legacy remote client (rag.mode=remote only) ---
  base-url: ${RAG_BASE_URL:http://135.222.41.146:8080}
  timeout: ${RAG_TIMEOUT:120000}  # 2 minutes for slow LLM responses
  enabled: ${RAG_ENABLED:true}
  api-key: ${RAG_API_KEY:agent-assist-secret-key-change-in-production}
  company-id: ${RAG_COMPANY_ID:1}   # also used as the tenant id by the internal lane
  # --- in-app lane (rag.mode=internal) ---
  internal:
    enabled: ${RAG_INTERNAL_ENABLED:true}
    # No Ollama server available right now -> OpenAI embeddings into a NEW
    # collection (auto-created; the legacy 1024-dim mxbai collection cannot be
    # searched with 1536-dim OpenAI vectors, so KB documents need one re-upload
    # via /admin). When the Ollama server is ready: set provider=ollama, point
    # spring.ai.ollama.base-url at it, and switch the collection back to
    # pdf_docs_new_mxbai-embed-large — the old documents return untouched.
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:openai}
    qdrant:
      host: ${QDRANT_HOST:74.225.250.214}
      port: ${QDRANT_PORT:6334}
      collection: ${QDRANT_COLLECTION:agent_assist_docs_openai}
      use-tls: false
      initialize-schema: true
    top-k: 3
    vector-score: 0.3
    min-relevance-score: 0.55
    chunk:
      size: 300
      overlap: 50
    file-storage:
      path: ${AGENT_ASSIST_FILES_PATH:./agent-assist-files}
      enabled: true

# Salesforce Integration (Policy & Claims)
salesforce:
  base-url: ${SALESFORCE_BASE_URL:https://salesforce.lab.bravishma.com}
  timeout: ${SALESFORCE_TIMEOUT:30000}
  enabled: ${SALESFORCE_ENABLED:true}

# Avaya Infinity Integration (Transcripts)
avaya:
  base-url: ${AVAYA_BASE_URL:https://core.showmeavayacom.ec.avayacloud.com}
  client-id: ${AVAYA_CLIENT_ID:transcript-api-01-001d010908da20232d07611320}
  client-secret: ${AVAYA_CLIENT_SECRET:0L3V-SL0W-RWQKV3GAWSMG}
  timeout: ${AVAYA_TIMEOUT:30000}

# Logging
logging:
  level:
    root: INFO
    com.agentassist: DEBUG
    org.springframework.ai: DEBUG
