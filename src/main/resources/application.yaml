server:
  port: ${SERVER_PORT:8080}

# Force servlet mode (not reactive) when webflux is present
spring.main:
  web-application-type: servlet

# File upload configuration
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 50MB

spring:
  datasource:
#      url: jdbc:mysql://localhost:3306/agent_assist?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8
#      username: root
#      password: root

      url: jdbc:mysql://localhost:3306/avaya_infinity?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.3
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:mistral:7b}
          temperature: 0.2

# AI provider selection
ai:
  provider: ${AI_PROVIDER:openai}
  openai:
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.2
  ollama:
    model: ${OLLAMA_MODEL:mistral:7b}
    temperature: 0.2

# JWT configuration (IMPORTANT: Set JWT_SECRET env variable in production!)
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_64_CHAR_MIN_SECRET_KEY_HERE_12345}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Liquibase
liquibase:
  change-log: classpath:db/changelog/db.changelog-master.yaml

# RAG Integration
rag:
  base-url: ${RAG_BASE_URL:http://135.222.41.146:8080}
  timeout: ${RAG_TIMEOUT:120000}  # 2 minutes for slow LLM responses
  enabled: ${RAG_ENABLED:true}
  api-key: ${RAG_API_KEY:agent-assist-secret-key-change-in-production}
  company-id: ${RAG_COMPANY_ID:1}

# Logging
logging:
  level:
    root: INFO
    com.agentassist: DEBUG
    org.springframework.ai: DEBUG
